name: AccessTrail checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/assemble.mjs
      - run: npm test
      - run: npm run build
      - run: npm run validate
